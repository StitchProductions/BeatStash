		3DD6FEB130512A0009BAF80 /* Bundle yt-dlp + ffmpeg */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(SRCROOT)/BeatStash/Resources/bin/yt-dlp",
				"$(SRCROOT)/BeatStash/Resources/bin/ffmpeg",
				"$(SRCROOT)/BeatStash/Resources/bin/ffprobe",
			);
			name = "Bundle yt-dlp + ffmpeg";
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/yt-dlp",
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/ffmpeg",
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/ffprobe",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nSRC_BIN=\"$SRCROOT/BeatStash/Resources/bin\"\nDST_BIN=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin\"\nmkdir -p \"$SRC_BIN\" \"$DST_BIN\"\n# Self-heal: yt-dlp is one portable file — fetch it when absent so a fresh\n# clone can never silently produce an app without it.\nif [ ! -f \"$SRC_BIN/yt-dlp\" ]; then\n  echo \"note: yt-dlp missing from $SRC_BIN - downloading stable release...\"\n  curl -L --fail \"https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos\" -o \"$SRC_BIN/yt-dlp\"\n  chmod +x \"$SRC_BIN/yt-dlp\"\nfi\nfor tool in yt-dlp ffmpeg ffprobe; do\n  if [ -f \"$SRC_BIN/$tool\" ]; then\n    cp -f \"$SRC_BIN/$tool\" \"$DST_BIN/$tool\"\n    chmod +x \"$DST_BIN/$tool\"\n    xattr -cr \"$DST_BIN/$tool\" || true\n    codesign -s - --timestamp=none \"$DST_BIN/$tool\" || true\n  else\n    echo \"error: $SRC_BIN/$tool not found - run scripts/setup-binaries.sh, then rebuild\"\n    exit 1\n  fi\ndone\nSRC_PLUGINS=\"$SRCROOT/BeatStash/Resources/plugins\"\nif [ -d \"$SRC_PLUGINS\" ] && [ -n \"$(ls -A \"$SRC_PLUGINS\" 2>/dev/null)\" ]; then\n  DST_PLUGINS=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/plugins\"\n  mkdir -p \"$DST_PLUGINS\"\n  cp -Rf \"$SRC_PLUGINS/.\" \"$DST_PLUGINS/\"\nfi\n# Intel + Apple Silicon: every bundled tool must stay universal so neither\n# architecture silently breaks when a future fetch ships a thin binary.\nfor tool in yt-dlp ffmpeg ffprobe; do\n  if ! lipo -info \"$DST_BIN/$tool\" 2>/dev/null | grep -q \"x86_64 arm64\"; then\n    echo \"error: $DST_BIN/$tool is not universal (x86_64+arm64) - refusing to bundle\"\n    exit 1\n  fi\ndone\necho \"note: bundled tools:\"\nfor tool in yt-dlp ffmpeg ffprobe; do\n  ver=\"$(\"$DST_BIN/$tool\" --version 2>&1 | head -1)\"\n  echo \"note:   $tool ${ver:-MISSING}\"\ndone\n";
		};
/* End PBXShellScriptBuildPhase section */

